<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <title>Hors ligne — MZSolutions</title>
  <style>
    body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7f7f8;color:#111827;text-align:center}
    main{max-width:26rem}
    h1{font-size:1.4rem;margin:0 0 .5rem}
    p{margin:.4rem 0;line-height:1.6;color:#4b5563}
    button{margin-top:1.25rem;padding:.8rem 1.6rem;border:0;border-radius:.6rem;background:#7c3aed;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
    button:active{transform:scale(.97)}
    @media (prefers-color-scheme:dark){body{background:#08090a;color:#e5e7eb}p{color:#9a9ca3}}
  </style>
</head>
<body>
  <main>
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de joindre MZSolutions. Vérifiez votre connexion internet puis réessayez.</p>
    <p dir="rtl" lang="ar">أنت غير متصل بالإنترنت. تحقق من اتصالك ثم أعد المحاولة.</p>
    <button type="button" onclick="location.reload()">Réessayer · إعادة المحاولة</button>
  </main>
</body>
</html>
